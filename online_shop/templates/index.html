{% extends "base.html" %}
{% block content %}
<h2>პროდუქტები (კალათაში: {{ count }})</h2>
<form class="search" method="get">
    <input type="text" name="q" placeholder="ძებნა..." value="{{ search }}">
    <button class="btn" type="submit">ძებნა</button>
</form>
<div class="products">
    {% for p in products %}
    <div class="card">
        <h3>{{ p.name }}</h3>
        <p class="price">{{ p.price }} ₾</p>
        <a class="btn" href="{{ url_for('add', product_id=p.id) }}">კალათაში დამატება</a>
    </div>
    {% else %}
    <p>პროდუქტი არ მოიძებნა</p>
    {% endfor %}
</div>
{% endblock %}
